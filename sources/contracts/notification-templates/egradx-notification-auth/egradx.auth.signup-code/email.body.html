<!DOCTYPE html>
<html>
<body style="font-family: sans-serif; line-height: 1.5;">
  <p>{{#if recipientName}}Hello {{recipientName}},{{else}}Hello,{{/if}}</p>
  <p>Enter this code to finish signing up and create {{organizationName}}:</p>
  <p style="font-size: 28px; letter-spacing: 6px; font-weight: bold;">{{code}}</p>
  <p>It expires in {{expiresInMinutes}} minutes. If you did not sign up, ignore this message: no account is made without the code.</p>
</body>
</html>
