<!DOCTYPE html>
<html>
<body style="font-family: sans-serif; line-height: 1.5;">
  <p>{{#if recipientName}}Hello {{recipientName}},{{else}}Hello,{{/if}}</p>
  <p>Enter this code to sign in:</p>
  <p style="font-size: 28px; letter-spacing: 6px; font-weight: bold;">{{code}}</p>
  <p>It expires in {{expiresInMinutes}} minutes. If you did not ask to sign in, ignore this message: nobody can sign in without the code.</p>
</body>
</html>
