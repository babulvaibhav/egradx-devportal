      - Notification administration
    get:
      description: "The templates stored for your organization, or on the platform\
        \ routes those stored for all organizations. Needs `egradx.notification.read`\
        \ or `egradx.notification.manage` (on the platform routes, `egradx.notification.broadcast`)."
      operationId: templates
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EgradxStoredTemplateView"
          description: OK
      summary: List the stored templates
      tags:
      - Notification administration
    put:
      description: "Stores the template for a notification key, channel and optional\
