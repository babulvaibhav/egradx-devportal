      operationId: deliveries
      parameters:
      - in: query
        name: status
        required: false
        schema:
          type: string
          enum:
          - PENDING
          - SENT
          - DEAD
      - in: query
        name: channel
        required: false
        schema:
          type: string
      - in: query
        name: trace
        required: false
        schema:
          type: string
      - in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          content:
            '*/*':
