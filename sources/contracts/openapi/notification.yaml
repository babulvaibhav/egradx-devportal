      operationId: saveTemplate_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemplateRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EgradxStoredTemplateView"
          description: OK
      summary: Save a template
      tags:
      - Notification administration (platform)
  /egradx/notifications/admin/platform/templates/preview:
    post:
      description: "Renders unsaved template text with sample values, for the preview\
        \ beside the editor. Needs `egradx.notification.read` or `egradx.notification.manage`\
