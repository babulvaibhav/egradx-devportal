          description: OK
      summary: List the notification types
      tags:
      - Notification administration
  /egradx/notifications/preference-options:
    get:
      description: "The channels that reach a person and are registered here, and\
        \ the kinds of message a person may opt out of. Needs a signed-in session."
      operationId: options
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Options"
          description: OK
      summary: Get the notification preference options
      tags:
      - Notification preferences
  /egradx/notifications/read-all:
    post:
      description: "Answers with `marked`, how many were marked. Needs a signed-in\
        \ session."
      operationId: markAllRead
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: integer
                  format: int32
          description: OK
      summary: Mark all your notifications read
      tags:
      - Notifications inbox
  /egradx/notifications/stream:
    get:
      description: "A server-sent event stream (event `notification`) of the caller's\
        \ notifications published after it opened. It does not replay earlier ones:\
        \ load the list and the count first. Needs a signed-in session."
      operationId: stream
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/SseEmitter"
          description: OK
      summary: Stream new notifications
      tags:
      - Notifications inbox
  /egradx/notifications/unread-count:
    get:
      description: "Answers with `count`, the number not yet read. Needs a signed-in\
        \ session."
      operationId: unreadCount
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: integer
                  format: int64
          description: OK
      summary: Count your unread notifications
      tags:
      - Notifications inbox
  /egradx/notifications/{id}/read:
    post:
      description: Answers 204. Needs a signed-in session. A notification that is
        not the caller's to see answers `NOTIFICATION_NOT_FOUND` (404).
      operationId: markRead
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
      summary: Mark a notification read
      tags:
      - Notifications inbox
