openapi: 3.1.0
info:
  title: EGRADX notification API
  version: 1.0.0
tags:
- description: "Notification administration for the organization your session is in:\
    \ templates, channel settings, the delivery log, and sends to its members. Looking\
    \ needs `egradx.notification.read`; changing or sending needs `egradx.notification.manage`,\
    \ which implies read. Anything belonging to another organization answers `NOT_FOUND`\
    \ (404)."
  name: Notification administration
- description: "The signed-in person's own in-app notifications. Needs only a signed-in\
    \ session (`NOT_AUTHENTICATED`, 401, without one): every route acts on the caller's\
    \ own notifications, never on an id passed in."
  name: Notifications inbox
- description: What a notification settings screen offers. The choices themselves
    are stored on the person's profile by egradx-auth (`PUT /egradx/auth/my/profile/preferences`).
  name: Notification preferences
- description: "The notification administration routes for what belongs to no single\
    \ organization: templates and channel settings that apply to every organization\
    \ without their own, the log of platform-level messages, in-app notices to every\
    \ user, and sends to every user. Everything needs `egradx.notification.broadcast`,\
    \ which only a role in the platform organization can hold."
  name: Notification administration (platform)
paths:
  /egradx/notifications:
    get:
      description: "A page of the caller's notifications, newest first; `unreadOnly=true`\
        \ leaves out those already read. Needs a signed-in session."
      operationId: list
      parameters:
      - in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      - in: query
        name: unreadOnly
        required: false
        schema:
          type: boolean
          default: false
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EgradxInboxPage"
          description: OK
      summary: List your notifications
      tags:
      - Notifications inbox
  /egradx/notifications/admin/bulk-sends:
    post:
      description: "Sends on one channel to every member of your organization, or\
        \ on the platform routes to every user, from a template (`notificationKey`\
        \ with `model`) or from the text given; answers 202 and the send continues\
        \ in the background. Needs `egradx.notification.manage` (on the platform routes,\
        \ `egradx.notification.broadcast`). Refusals include `CHANNEL_UNAVAILABLE`,\
        \ `AUDIENCE_TOO_LARGE` and `TEMPLATE_INVALID` (400)."
      operationId: sendToEveryone_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkSendRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SendAccepted"
          description: OK
      summary: Send a message to everyone
      tags:
      - Notification administration
  /egradx/notifications/admin/bulk-sends/{bulkSendId}:
    get:
      description: "Needs `egradx.notification.read` or `egradx.notification.manage`\
        \ (on the platform routes, `egradx.notification.broadcast`). A bulk send outside\
        \ this scope answers `NOT_FOUND` (404)."
      operationId: bulkSend_1
      parameters:
      - in: path
        name: bulkSendId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EgradxBulkSendView"
          description: OK
      summary: Get a bulk send
      tags:
      - Notification administration
  /egradx/notifications/admin/channels:
    get:
      description: "Every channel, whether it can send here (and why not), and the\
        \ settings stored for this scope. Needs `egradx.notification.read` or `egradx.notification.manage`\
        \ (on the platform routes, `egradx.notification.broadcast`)."
      operationId: channels_1
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChannelStatus"
          description: OK
      summary: List the channels
      tags:
      - Notification administration
  /egradx/notifications/admin/channels/{channel}:
    delete:
      description: "Needs `egradx.notification.manage` (on the platform routes, `egradx.notification.broadcast`).\
        \ Answers `NOT_FOUND` (404) when nothing is stored for the channel."
      operationId: deleteChannel_1
      parameters:
      - in: path
        name: channel
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
      summary: Delete a channel's stored settings
      tags:
      - Notification administration
    put:
      description: "Stores whether the channel is enabled, its settings and its secret,\
        \ for this scope. Needs `egradx.notification.manage` (on the platform routes,\
        \ `egradx.notification.broadcast`)."
      operationId: saveChannel_1
      parameters:
      - in: path
        name: channel
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChannelConfigRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EgradxChannelConfigView"
          description: OK
      summary: Save a channel's settings
      tags:
      - Notification administration
  /egradx/notifications/admin/channels/{channel}/secret:
    delete:
      description: "Needs `egradx.notification.manage` (on the platform routes, `egradx.notification.broadcast`).\
        \ Answers `NOT_FOUND` (404) when no secret is stored for the channel."
      operationId: clearSecret_1
      parameters:
      - in: path
        name: channel
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
      summary: Clear a channel's secret
      tags:
      - Notification administration
  /egradx/notifications/admin/channels/{channel}/test:
    post:
      description: "Sends the library's settings-work message to the address given,\
        \ through the outbox like any other message, so its result is in the delivery\
        \ log a moment later. Answers 202. Needs `egradx.notification.manage` (on\
        \ the platform routes, `egradx.notification.broadcast`)."
      operationId: testChannel_1
      parameters:
      - in: path
        name: channel
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChannelTestRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SendAccepted"
          description: OK
      summary: Send a test message through a channel
      tags:
      - Notification administration
  /egradx/notifications/admin/deliveries:
    get:
      description: "A page of deliveries, filtered by `status`, `channel` and `trace`\
        \ (a trace id or an `X-Request-ID`: what one request sent). Needs `egradx.notification.read`\
        \ or `egradx.notification.manage` (on the platform routes, `egradx.notification.broadcast`)."
      operationId: deliveries_1
      parameters:
      - in: query
        name: status
        required: false
        schema:
          type: string
          enum:
          - PENDING
          - SENT
          - DEAD
      - in: query
        name: channel
        required: false
        schema:
          type: string
      - in: query
        name: trace
        required: false
        schema:
          type: string
      - in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EgradxDeliveryPage"
          description: OK
      summary: Search the delivery log
      tags:
      - Notification administration
  /egradx/notifications/admin/deliveries/{deliveryId}:
    get:
      description: "Needs `egradx.notification.read` or `egradx.notification.manage`\
        \ (on the platform routes, `egradx.notification.broadcast`). A delivery outside\
        \ this scope answers `NOT_FOUND` (404)."
      operationId: delivery_1
      parameters:
      - in: path
        name: deliveryId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EgradxDeliveryView"
          description: OK
      summary: Get a delivery
      tags:
      - Notification administration
  /egradx/notifications/admin/deliveries/{deliveryId}/requeue:
    post:
      description: "Gives a `DEAD` delivery a fresh set of attempts, after fixing\
        \ whatever killed it. Needs `egradx.notification.manage` (on the platform\
        \ routes, `egradx.notification.broadcast`). A delivery in any other status\
        \ is refused with `INVALID_REQUEST` (400)."
      operationId: requeue_1
      parameters:
      - in: path
        name: deliveryId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EgradxDeliveryView"
          description: OK
      summary: Requeue a dead delivery
      tags:
      - Notification administration
  /egradx/notifications/admin/in-app:
    post:
      description: "To one person (`audience` USER), the organization (ORGANIZATION),\
        \ or, on the platform routes only, a named organization or every user of every\
        \ organization (PLATFORM); answers 201 with its id. Needs `egradx.notification.manage`\
        \ (on the platform routes, `egradx.notification.broadcast`). PLATFORM from\
        \ the organization routes is refused with `ACCESS_DENIED` (403)."
      operationId: publish_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InAppRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Published"
          description: OK
      summary: Publish an in-app notification
      tags:
      - Notification administration
  /egradx/notifications/admin/platform/bulk-sends:
    post:
      description: "Sends on one channel to every member of your organization, or\
        \ on the platform routes to every user, from a template (`notificationKey`\
