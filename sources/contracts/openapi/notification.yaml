                type: array
                items:
                  $ref: "#/components/schemas/EgradxStoredTemplateView"
          description: OK
      summary: List the stored templates
      tags:
      - Notification administration (platform)
    put:
      description: "Stores the template for a notification key, channel and optional\
        \ locale, replacing any stored for the same. Needs `egradx.notification.manage`\
        \ (on the platform routes, `egradx.notification.broadcast`). Refuses a template\
        \ that does not compile or uses an undeclared variable with `TEMPLATE_INVALID`\
