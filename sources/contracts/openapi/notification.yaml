  /egradx/notifications/admin/platform/templates:
    delete:
      description: "Needs `egradx.notification.manage` (on the platform routes, `egradx.notification.broadcast`).\
        \ Answers `NOT_FOUND` (404) when nothing is stored for that key, channel and\
        \ locale."
      operationId: deleteTemplate_1
      parameters:
      - in: query
        name: notificationKey
        required: true
        schema:
          type: string
      - in: query
        name: channel
        required: true
        schema:
          type: string
      - in: query
        name: locale
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
      summary: Delete a stored template
      tags:
      - Notification administration (platform)
    get:
      description: "The templates stored for your organization, or on the platform\
        \ routes those stored for all organizations. Needs `egradx.notification.read`\
        \ or `egradx.notification.manage` (on the platform routes, `egradx.notification.broadcast`)."
      operationId: templates_1
      responses:
        "200":
          content:
            '*/*':
