  /egradx/notifications/admin/types:
    get:
      description: "The notification types and the variables each takes, for a template\
        \ editor. Needs `egradx.notification.read` or `egradx.notification.manage`\
        \ (on the platform routes, `egradx.notification.broadcast`)."
      operationId: types
      responses:
        "200":
          content:
            '*/*':
              schema:
