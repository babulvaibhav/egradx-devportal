        \ locale."
      operationId: deleteTemplate
      parameters:
      - in: query
        name: notificationKey
        required: true
        schema:
          type: string
      - in: query
        name: channel
        required: true
        schema:
          type: string
      - in: query
        name: locale
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
      summary: Delete a stored template
