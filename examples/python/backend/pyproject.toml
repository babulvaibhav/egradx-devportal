# docs:region pyproject
[project]
name = "notes"
version = "0.0.1"
description = "The developer portal's example application"
requires-python = ">=3.12"
dependencies = [
    "egradx-sdk==1.0.0",
    "egradx-events==1.0.0",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-exporter-prometheus>=0.48b0",
    "opentelemetry-instrumentation-asgi>=0.48b0",
    "fastapi",
    "uvicorn",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=1.0", "httpx>=0.28", "aiosmtpd>=1.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notes"]

[tool.uv]
find-links = ["egradx-wheels"]   # the SDK's wheels, downloaded by scripts/get_wheels.py
# docs:end

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
